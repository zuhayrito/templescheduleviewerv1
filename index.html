                return { hasError: true, error };

        const splitLine = (text) => {
            const result = [];
            let cur = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                if (text[i] === '"') {
                    inQuotes = !inQuotes;
                } else if (text[i] === ',' && !inQuotes) {
                    result.push(cur);
                    cur = '';
                } else {
                    cur += text[i];
                }
            }
            result.push(cur);
            return result.map(s => s.trim());
        };

        const parseCSVData = (csvText) => {
            const lines = csvText.split(/\r?\n/);
            if (lines.length < 3) return null;

            let dateRowLineIdx = 1; 
            let dateRow = splitLine(lines[dateRowLineIdx]);
            let firstDateIdx = 1;
            const dates = dateRow.slice(firstDateIdx).filter(d => d.includes('/'));

            const blocks = [];
            let currentBlock = [];
            const rotKey = ROTATION_KEY;
            let currentPgyLabel = "PGY4s"; 

            for (let i = 3; i < lines.length; i++) {
                const line = lines[i].trim();
                const cols = splitLine(line);
                
                if (cols.every(c => c === '')) continue;

                if (cols[0].startsWith('PGY') && !cols[0].includes(',')) {
                    if (currentBlock.length > 0) {
                        blocks.push({ label: currentPgyLabel, residents: currentBlock });
                        currentBlock = [];
                    }
                    currentPgyLabel = cols[0];
                    continue;
                }

                const hasScheduleData = cols.slice(2).some(c => c.trim() !== '');
                if (cols.length > dates.length / 2 && cols[0].trim() !== '' && hasScheduleData && !ROTATION_KEY[cols[0].trim()]) {
                    currentBlock.push(cols);
                } 
            }
            if (currentBlock.length > 0) blocks.push({ label: currentPgyLabel, residents: currentBlock });

            const residentsByPgy = {};

            blocks.forEach((block) => {
                residentsByPgy[block.label] = block.residents.map(cols => {
                    const name = cols[0].replace(/"/g, '').trim();
                    const schedule = dates.map((d, j) => ({
                        date: d,
                        rotation: cols[j + firstDateIdx] ? cols[j + firstDateIdx].trim() : 'Off'
                    }));
                    return { name, pgy: block.label, schedule };
                });
            });

            return { residentsByPgy, dates, rotKey };
        };

                    const mNum = parseInt(week.date.split('/')[0], 10);
                    if (mNum < lastMonthNum - 3) {
                        curYear++;
                    }
                    lastMonthNum = mNum;

                    const dateObj = new Date(curYear, mNum - 1, 1);
                    const monthName = dateObj.toLocaleString('default', { month: 'long' });
                    const monthKey = `${monthName} ${curYear}`;

                    let group = monthGroups.find((g) => g.key === monthKey);
                    if (!group) {
                        group = { key: monthKey, monthName, year: curYear, weeks: [] };

                        )}

                        <div className="mt-16 mb-2 text-center w-full">
                            <p className="text-white/60 text-xs font-medium tracking-widest">-ZS 2026</p>
                        </div>
                    </div>
                );
            }

            if (appState === 'VIEW' && selectedResidents.length > 0) {
                const isSingle = selectedResidents.length === 1;
                
                const monthSpans = [];
                const firstSchedule = selectedResidents[0].schedule;
                let currentMonthNum = firstSchedule[0].date.split('/')[0];
                let count = 0;
                
                firstSchedule.forEach(week => {
                    const monthPart = week.date.split('/')[0];
                    if (monthPart === currentMonthNum) {
                        count++;
                    } else {
                        monthSpans.push({ monthNum: currentMonthNum, count });
                        currentMonthNum = monthPart;
                        count = 1;
                    }
                });
                monthSpans.push({ monthNum: currentMonthNum, count });
                const monthNames = { "01":"Jan", "02":"Feb", "03":"Mar", "04":"Apr", "05":"May", "06":"Jun", "07":"Jul", "08":"Aug", "09":"Sep", "10":"Oct", "11":"Nov", "12":"Dec" };
                
                // Safe fallback for old browsers without array.flatMap()
                const allRotCodes = [...new Set(
                    selectedResidents.reduce((acc, r) => acc.concat(r.schedule.map(s => s.rotation)), [])
                )];

                return (
                    <div className="min-h-screen bg-[#9e152b] p-4 md:p-8 flex flex-col justify-between w-full">
                        <div className="max-w-[1400px] mx-auto w-full">
                            {/* Header */}
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4">
                                <div className="flex items-center space-x-3 md:space-x-4">
                                    <button 
                                        onClick={() => setAppState('SELECT')}
                                        className="no-print p-2 bg-white/10 border border-white/20 rounded-lg hover:bg-white/20 transition-colors text-white shrink-0"
                                    >
                                        <ChevronLeft size={20} />
                                    </button>
                                    <img 
                                        src="https://templenews-media.s3.amazonaws.com/wp-content/uploads/2023/08/01102429/Screen-Shot-2023-08-01-at-10.21.10-AM.png" 
                                        alt="Temple Logo" 
                                        className="h-8 md:h-10 w-auto object-contain sm:block hidden rounded bg-white p-1" 
                                        onError={(e) => e.target.style.display='none'} 
                                    />
                                    <div className="min-w-0 flex-1">
                                        <h1 className="text-xl md:text-2xl font-bold text-white print:text-black flex items-center flex-wrap gap-2">
                                            <span className="truncate">{isSingle ? selectedResidents[0].name.split(',')[0] : "Side-by-Side Comparison"}</span>
                                            {isSingle && (
                                                <span className="px-2 py-0.5 md:px-3 md:py-1 bg-white/20 print:bg-slate-200 text-white print:text-slate-700 border border-white/30 print:border-transparent text-[10px] md:text-sm rounded-full font-medium whitespace-nowrap">
                                                    {selectedResidents[0].pgy}
                                                </span>
                                            )}
                                        </h1>
                                        <p className="text-white/80 print:text-slate-500 text-xs md:text-sm mt-0.5">Academic Year 2026 - 2027</p>
                                    </div>
                                </div>
                                <div className="flex gap-2">
                                    {isSingle && (
                                        <div className="flex bg-black/30 p-1 rounded-lg shrink-0">
                                            <button onClick={() => setViewMode('GRID')} className={`px-3 py-1.5 md:py-2 text-xs md:text-sm font-bold rounded-md flex items-center gap-1.5 transition-all ${viewMode === 'GRID' ? 'bg-white text-[#9e152b] shadow-sm' : 'text-white hover:bg-white/10'}`}>
                                                <GridIcon size={14} /> <span className="hidden sm:inline">Grid</span>
                                            </button>
                                            <button onClick={() => setViewMode('TIMELINE')} className={`px-3 py-1.5 md:py-2 text-xs md:text-sm font-bold rounded-md flex items-center gap-1.5 transition-all ${viewMode === 'TIMELINE' ? 'bg-white text-[#9e152b] shadow-sm' : 'text-white hover:bg-white/10'}`}>
                                                <ListIcon size={14} /> <span className="hidden sm:inline">Timeline</span>
                                            </button>
                                        </div>
                                    )}
                                    <button 
                                        onClick={() => window.print()}
                                        className="no-print px-4 py-1.5 md:py-2.5 bg-white text-[#9e152b] rounded-xl font-bold shadow-sm hover:bg-slate-100 transition-colors hidden sm:block whitespace-nowrap text-sm md:text-base"
                                    >
                                        Print
                                    </button>
                                </div>
                            </div>

                            <div className="mb-6 bg-white/10 border border-white/20 p-2.5 md:p-3 rounded-xl flex items-center justify-center text-white text-xs md:text-sm font-medium shadow-sm no-print transition-all hover:bg-white/20 text-center mx-1">
                                <Info size={16} className="mr-2 opacity-90 shrink-0" />
                                <span>Click any rotation block to see who else shares that rotation week!</span>
                            </div>

                            {viewMode === 'TIMELINE' && typeof window !== 'undefined' && window.innerWidth < 768 && isPortrait && (
                                <div className="mb-4 bg-blue-900/40 border border-blue-400/30 p-2 rounded-lg flex justify-center text-white text-[10px] uppercase font-bold tracking-widest text-center shadow-inner no-print animate-pulse">
                                    Rotate device for best Timeline view
                                </div>
                            )}

                            {viewMode === 'GRID' && isSingle ? (
                                <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-2 md:gap-6 mb-8 w-full">
                                    {organizeByMonth(selectedResidents[0].schedule).map((monthData, idx) => (
                                        <div key={idx} className="bg-white border border-slate-200 rounded-lg md:rounded-xl overflow-hidden shadow-sm flex flex-col h-full print:break-inside-avoid">
                                            <div className="bg-slate-100 border-b border-slate-200 px-2 py-1.5 md:px-4 md:py-3 flex justify-between items-center">
                                                <h3 className="font-bold text-slate-800 text-[10px] md:text-base truncate">{monthData.monthName}</h3>
                                                <span className="text-[8px] md:text-xs font-semibold text-slate-500 bg-white px-1.5 py-0.5 md:px-2 md:py-1 rounded border border-slate-200 shrink-0 ml-1">
                                                    {monthData.year}
                                                </span>
                                            </div>
                                            
                                            <div className="p-1 md:p-4 flex-1 flex flex-col justify-center">
                                                <div className="flex h-8 md:h-16 w-full rounded md:rounded-lg overflow-hidden border border-slate-200 shadow-inner">
                                                    {monthData.weeks.map((week, wIdx) => {
                                                        const colorClass = colorMap[week.rotation] || 'bg-slate-100 text-slate-800';
                                                        return (
                                                            <div 
                                                                key={wIdx} 
                                                                onClick={() => handleTileClick(selectedResidents[0], week)}
                                                                title={`${data.rotKey[week.rotation] || week.rotation} (Week of ${week.date})`}
                                                                className={`flex-1 flex flex-col items-center justify-center border-r last:border-r-0 border-white/40 transition-all hover:opacity-90 hover:scale-[1.1] cursor-pointer ${colorClass}`}
                                                            >
                                                                <span className="font-extrabold text-[7px] md:text-base tracking-tighter md:tracking-tight">{week.rotation}</span>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                                <div className="flex mt-1 md:mt-2 px-px md:px-1">
                                                    {monthData.weeks.map((week, wIdx) => (
                                                        <div key={wIdx} className="flex-1 text-center text-[5px] md:text-[10px] text-slate-400 font-medium whitespace-nowrap overflow-hidden text-ellipsis">
                                                            {week.date}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="bg-white rounded-xl md:rounded-2xl shadow-xl overflow-hidden mb-8 border border-slate-200 w-full flex flex-col">
                                    <div className="bg-slate-100 border-b border-slate-200 px-3 md:px-4 py-2 flex items-center justify-between no-print shrink-0">
                                        <span className="text-[10px] md:text-xs font-bold text-slate-500 uppercase tracking-wider hidden sm:block">Timeline Controls</span>
                                        <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider sm:hidden">Zoom</span>
                                        <div className="flex items-center gap-1.5 md:gap-2">
                                            <button onClick={() => setZoom(Math.max(1, zoom - 0.5))} className="p-1.5 md:p-2 bg-white rounded-md shadow-sm border border-slate-200 hover:bg-slate-50 text-slate-600 transition-colors active:scale-95"><ZoomOut size={16} /></button>
                                            <span className="text-[10px] md:text-xs font-bold w-8 md:w-10 text-center text-slate-700 bg-white py-1 md:py-1.5 rounded-md border border-slate-200">{zoom * 100}%</span>
                                            <button onClick={() => setZoom(Math.min(5, zoom + 0.5))} className="p-1.5 md:p-2 bg-white rounded-md shadow-sm border border-slate-200 hover:bg-slate-50 text-slate-600 transition-colors active:scale-95"><ZoomIn size={16} /></button>
                                        </div>
                                    </div>
                                    <div className="flex w-full overflow-x-auto relative hide-scrollbar">
                                        {/* Sticky Names Column */}
                                        <div className="sticky left-0 z-20 w-[90px] md:w-[164px] bg-white border-r border-slate-200 shadow-[2px_0_10px_rgba(0,0,0,0.08)] shrink-0 flex flex-col pb-2">
                                            <div className="h-8 md:h-10 bg-slate-50 border-b border-slate-200 shrink-0"></div>
                                            {selectedResidents.map((res, idx) => (
                                                <div key={idx} className="h-10 md:h-14 flex flex-col justify-center px-2 md:px-4 border-b border-slate-100 last:border-0 bg-white shrink-0 overflow-hidden group hover:bg-slate-50">
                                                    <h3 className="font-bold text-[9px] md:text-sm text-slate-800 leading-tight truncate w-full group-hover:text-[#9e152b] transition-colors" title={res.name}>{res.name.split(',')[0]}</h3>
                                                    <p className="text-[7px] md:text-[11px] font-medium text-slate-400 mt-0.5 truncate w-full">{res.pgy}</p>
                                                </div>
                                            ))}
                                        </div>
                                        {/* Scrollable Timeline */}
                                        <div className="flex flex-col flex-1 pb-2" style={{ minWidth: `${100 * zoom}%` }}>
                                            <div className="flex h-8 md:h-10 border-b border-slate-200 bg-slate-50 shrink-0">
                                                {monthSpans.map((ms, i) => (
                                                    <div key={i} style={{ flex: ms.count }} className="text-center text-[8px] md:text-xs font-bold text-slate-500 uppercase tracking-wider border-l border-slate-200/50 flex items-center justify-center first:border-l-0 overflow-hidden px-1">
                                                        <span className="truncate">{monthNames[ms.monthNum]}</span>
                                                    </div>
                                                ))}
                                            </div>
                                            {selectedResidents.map((res, rIdx) => (
                                                <div key={rIdx} className="flex h-10 md:h-14 border-b border-slate-100 last:border-0 w-full shrink-0">
                                                    {res.schedule.map((week, wIdx) => {
                                                        const colorClass = colorMap[week.rotation] || 'bg-slate-100 text-slate-800';
                                                        return (
                                                            <div 
                                                                key={wIdx} 
                                                                onClick={() => handleTileClick(res, week)}
                                                                title={`${data.rotKey[week.rotation] || week.rotation} (Week of ${week.date})`}
                                                                className={`flex-1 flex flex-col items-center justify-center border-r border-white/40 cursor-pointer transition-all hover:opacity-80 hover:z-10 hover:shadow-lg ${colorClass} overflow-hidden`}
                                                            >
                                                                <span className="font-extrabold text-[7px] md:text-[10px] tracking-tighter truncate w-full text-center px-px">{week.rotation}</span>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            <div className="bg-white p-4 md:p-5 rounded-xl border border-slate-200 shadow-sm mb-4 w-full">
                                <h3 className="text-xs md:text-sm font-bold text-slate-700 flex items-center mb-3">
                                    <Info size={16} className="mr-2 shrink-0" /> Shared Rotation Key
                                </h3>
                                <div className="flex flex-wrap gap-2 md:gap-3">
                                    {allRotCodes.map((code) => {
                                        const colorClass = colorMap[code] || 'bg-gray-100 text-gray-800 border-gray-300';
                                        return (
                                            <div key={code} className={`flex items-center px-2 py-1 md:px-3 md:py-1.5 rounded-md md:rounded-lg border text-[10px] md:text-sm font-medium ${colorClass}`}>
                                                <span className="font-bold mr-1.5 md:mr-2">{code}</span>
                                                <span className="opacity-80 font-normal whitespace-nowrap">
                                                    {data.rotKey[code] || 'Unknown'}
                                                </span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        {overlapModal && (() => {
                            const bgColorClass = colorMap[overlapModal.week.rotation] ? colorMap[overlapModal.week.rotation].split(' ')[0] : 'bg-slate-300';
                            return (
                            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 md:p-6 no-print">
                                <div className="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-5 md:p-7 relative transform transition-all border border-slate-100 flex flex-col max-h-[90vh]">
                                    <button onClick={() => setOverlapModal(null)} className="absolute top-4 right-4 md:top-5 md:right-5 text-slate-400 hover:text-[#9e152b] bg-slate-50 hover:bg-red-50 p-2 rounded-full transition-colors z-10 shrink-0">
                                        <XIcon size={20} />
                                    </button>
                                    
                                    <div className="shrink-0 mb-4 pr-10">
                                        <div className="flex items-center gap-2 md:gap-3 mb-1">
                                            <div className={`w-3 h-3 md:w-4 md:h-4 rounded-full shadow-inner shrink-0 ${bgColorClass}`}></div>
                                            <h3 className="text-xl md:text-2xl font-bold text-slate-800 tracking-tight leading-tight">{data.rotKey[overlapModal.week.rotation] || overlapModal.week.rotation}</h3>
                                        </div>
                                        <p className="text-slate-500 text-xs md:text-sm font-medium pl-5 md:pl-7">
                                            Week of {overlapModal.week.date}
                                        </p>
                                    </div>
                                    
                                    <div className="bg-slate-50 rounded-2xl p-4 md:p-5 border border-slate-200/60 overflow-y-auto flex-1 min-h-0 hide-scrollbar shadow-inner">
                                        {overlapModal.overlaps.length > 0 ? (
                                            <div>
                                                <p className="text-slate-400 text-[10px] md:text-xs font-bold uppercase tracking-wider mb-3 ml-1 flex items-center gap-2">
                                                    Overlaps With <span className="bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">{overlapModal.overlaps.length}</span>
                                                </p>
                                                <div className="flex flex-col gap-2 md:gap-3">
                                                    {overlapModal.overlaps.map((r, i) => {
                                                        const cleanPgy = r.pgy.replace('s', '');
                                                        const cleanName = r.name.includes(',') ? `${r.name.split(',')[1].trim()} ${r.name.split(',')[0].trim()}` : r.name;
                                                        const overlapWeek = r.schedule.find(w => w.date === overlapModal.week.date);
                                                        const overlapRotation = overlapWeek ? overlapWeek.rotation : '';
                                                        const tileColorClass = colorMap[overlapRotation] || 'bg-slate-100 text-slate-800';
                                                        
                                                        return (
                                                            <div key={i} className="flex items-center gap-2 md:gap-3 text-slate-700 bg-white border border-slate-200 px-3 py-2 md:px-4 md:py-3 rounded-xl shadow-sm hover:shadow-md transition-shadow">
                                                                <div className={`w-8 h-8 md:w-9 md:h-9 rounded-md flex items-center justify-center shrink-0 border border-white/40 shadow-inner ${tileColorClass}`}>
                                                                    <span className="font-extrabold text-[8px] md:text-[10px] tracking-tighter">{overlapRotation}</span>
                                                                </div>
                                                                <span className="font-extrabold text-[#9e152b] text-[9px] md:text-[11px] px-1.5 py-0.5 md:px-2 md:py-1 bg-[#9e152b]/10 rounded-md tracking-wide shrink-0">{cleanPgy}</span>
                                                                <span className="font-semibold text-sm md:text-[15px] truncate">{cleanName}</span>
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="text-center py-6 md:py-8 flex flex-col items-center justify-center h-full">
                                                <div className="w-10 h-10 md:w-12 md:h-12 bg-slate-200 rounded-full flex items-center justify-center mb-3 shadow-inner">
                                                    <Info size={20} className="text-slate-400" />
                                                </div>
                                                <p className="text-slate-600 font-bold text-sm md:text-base">No overlaps found.</p>
                                                <p className="text-slate-400 text-xs md:text-sm mt-1 max-w-[200px]">This resident is solo on this rotation for this week.</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                            );
                        })()}

                        <div className="mt-8 mb-2 text-center w-full no-print">
                            <p className="text-white/60 text-[10px] md:text-xs font-medium tracking-widest">-ZS 2026</p>
                        </div>
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
