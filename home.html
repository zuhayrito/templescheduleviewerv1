        const splitLine = (text) => {
            const result = [];
            let cur = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                if (text[i] === '"') {
                    inQuotes = !inQuotes;
                } else if (text[i] === ',' && !inQuotes) {
                    result.push(cur);
                    cur = '';
                } else {
                    cur += text[i];
                }
            }
            result.push(cur);
            return result.map(s => s.trim());
        };

        const parseCSVData = (csvText) => {
            const lines = csvText.split(/\r?\n/);
            if (lines.length < 3) return null;

            let dateRowLineIdx = 1; 
            let dateRow = splitLine(lines[dateRowLineIdx]);
            let firstDateIdx = 1;
            const dates = dateRow.slice(firstDateIdx).filter(d => d.includes('/'));

            const blocks = [];
            let currentBlock = [];
            const rotKey = ROTATION_KEY;
            let currentPgyLabel = "PGY4s"; 

            for (let i = 3; i < lines.length; i++) {
                const line = lines[i].trim();
                const cols = splitLine(line);
                
                if (cols.every(c => c === '')) continue;

                if (cols[0].startsWith('PGY') && !cols[0].includes(',')) {
                    if (currentBlock.length > 0) {
                        blocks.push({ label: currentPgyLabel, residents: currentBlock });
                        currentBlock = [];
                    }
                    currentPgyLabel = cols[0];
                    continue;
                }

                const hasScheduleData = cols.slice(2).some(c => c.trim() !== '');
                if (cols.length > dates.length / 2 && cols[0].trim() !== '' && hasScheduleData && !ROTATION_KEY[cols[0].trim()]) {
                    currentBlock.push(cols);
                } 
            }
            if (currentBlock.length > 0) blocks.push({ label: currentPgyLabel, residents: currentBlock });

            const residentsByPgy = {};

            blocks.forEach((block) => {
                residentsByPgy[block.label] = block.residents.map(cols => {
                    const name = cols[0].replace(/"/g, '').trim();
                    const schedule = dates.map((d, j) => ({
                        date: d,
                        rotation: cols[j + firstDateIdx] ? cols[j + firstDateIdx].trim() : 'Off'
                    }));
                    return { name, pgy: block.label, schedule };
                });
            });

            return { residentsByPgy, dates, rotKey };
        };

            const [appState, setAppState] = useState('SELECT'); // SELECT, VIEW

            const [overlapModal, setOverlapModal] = useState(null);

                const boldBlack = "bg-black text-white border-gray-900 font-extrabold shadow-sm";
                newColorMap["C1"] = boldBlack;
                newColorMap["c1"] = boldBlack;
                newColorMap["1N"] = boldBlack;
                newColorMap["1n"] = boldBlack; // lowercase coverage
                newColorMap["IN"] = boldBlack; // typo coverage

                const royalBlue = "bg-blue-600 text-white border-blue-800 font-extrabold shadow-sm";
                newColorMap["C2"] = royalBlue;
                newColorMap["C3"] = royalBlue;
                newColorMap["C4"] = royalBlue;
                newColorMap["C5"] = royalBlue;

                newColorMap["ON"] = "bg-purple-600 text-white border-purple-800 font-extrabold shadow-sm";

                let colorIdx = 0;
                
                Object.keys(initialData.rotKey).forEach(code => {
                    if (!newColorMap[code]) {
                        newColorMap[code] = PALETTE[colorIdx % PALETTE.length];
                        colorIdx++;
                    }
                });

                Object.values(initialData.residentsByPgy).flat().forEach(resident => {
                    resident.schedule.forEach(week => {
                        if (!newColorMap[week.rotation]) {
                            newColorMap[week.rotation] = PALETTE[colorIdx % PALETTE.length];
                            colorIdx++;
                        }
                    });
                });
                return newColorMap;

                schedule.forEach((week) => {
                    const mNum = parseInt(week.date.split('/')[0], 10);
                    if (mNum < lastMonthNum - 3) {
                        curYear++;
                    }
                    lastMonthNum = mNum;

                    const dateObj = new Date(curYear, mNum - 1, 1);
                    const monthName = dateObj.toLocaleString('default', { month: 'long' });
                    const monthKey = `${monthName} ${curYear}`;

                    let group = monthGroups.find((g) => g.key === monthKey);
                    if (!group) {
                        group = { key: monthKey, monthName, year: curYear, weeks: [] };
                        monthGroups.push(group);
                    }
                    group.weeks.push(week);

                    if (cGroup.includes(rot1) && cGroup.includes(rot2)) return true;
                    return rot1 === rot2;

                                </h3>
                                <div className="flex flex-wrap gap-3">
                                    {allRotCodes.map((code) => {
                                        const colorClass = colorMap[code] || 'bg-gray-100 text-gray-800 border-gray-300';
                                        return (
                                            <div key={code} className={`flex items-center px-3 py-1.5 rounded-lg border text-sm font-medium ${colorClass}`}>
                                                <span className="font-bold mr-2">{code}</span>
                                                <span className="opacity-80 font-normal">
                                                    {data.rotKey[code] || 'Unknown'}
                                                </span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        {}
                        {overlapModal && (
                            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 no-print">
                                <div className="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-7 relative transform transition-all border border-slate-100">
                                    <button onClick={() => setOverlapModal(null)} className="absolute top-5 right-5 text-slate-400 hover:text-[#9e152b] bg-slate-50 hover:bg-red-50 p-2 rounded-full transition-colors">
                                        <XIcon size={20} />
                                    </button>
                                    
                                    <div className="flex items-center gap-3 mb-2">
                                        <div className={`w-4 h-4 rounded-full shadow-inner ${colorMap[overlapModal.week.rotation]?.split(' ')[0] || 'bg-slate-300'}`}></div>
                                        <h3 className="text-2xl font-bold text-slate-800 tracking-tight">{data.rotKey[overlapModal.week.rotation] || overlapModal.week.rotation}</h3>
                                    </div>
                                    <p className="text-slate-500 mb-6 text-sm font-medium pl-7">
                                        Week of {overlapModal.week.date}
                                    </p>
                                    
                                    <div className="bg-slate-50 rounded-2xl p-5 border border-slate-200/60 max-h-[300px] overflow-y-auto">
                                        {overlapModal.overlaps.length > 0 ? (
                                            <div>
                                                <p className="text-slate-500 text-xs font-bold uppercase tracking-wider mb-3 ml-1">Overlaps With</p>
                                                <div className="flex flex-col gap-2">
                                                    {overlapModal.overlaps.map((r, i) => {
                                                        const cleanPgy = r.pgy.replace('s', '');
                                                        const cleanName = r.name.includes(',') ? `${r.name.split(',')[1].trim()} ${r.name.split(',')[0].trim()}` : r.name;
                                                        const overlapWeek = r.schedule.find(w => w.date === overlapModal.week.date);
                                                        const overlapRotation = overlapWeek ? overlapWeek.rotation : '';
                                                        const tileColorClass = colorMap[overlapRotation] || 'bg-slate-100 text-slate-800';
                                                        
                                                        return (
                                                            <div key={i} className="flex items-center gap-3 text-slate-700 bg-white border border-slate-200 px-4 py-3 rounded-xl shadow-sm hover:shadow-md transition-shadow">
                                                                <div className={`w-9 h-9 rounded-md flex items-center justify-center shrink-0 border border-white/40 shadow-inner ${tileColorClass}`}>
                                                                    <span className="font-extrabold text-[10px] tracking-tighter">{overlapRotation}</span>
                                                                </div>
                                                                <span className="font-extrabold text-[#9e152b] text-[11px] px-2 py-1 bg-[#9e152b]/10 rounded-md tracking-wide">{cleanPgy}</span>
                                                                <span className="font-semibold text-[15px]">{cleanName}</span>
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="text-center py-8">
                                                <div className="w-12 h-12 bg-slate-200 rounded-full flex items-center justify-center mx-auto mb-3">
                                                    <Info size={24} className="text-slate-400" />
                                                </div>
                                                <p className="text-slate-600 font-medium">No overlaps found.</p>
                                                <p className="text-slate-400 text-sm mt-1">This resident is solo on this rotation for this week.</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="mt-16 mb-2 text-center w-full no-print">
                            <p className="text-white/60 text-xs font-medium tracking-widest">-ZS 2026</p>
                        </div>
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
